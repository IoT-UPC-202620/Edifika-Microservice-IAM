spring.application.name=Edifika-Microservice-IAM

# Variables locales (.env en la raiz del proyecto, ignorado por git)
spring.config.import=optional:file:.env[.properties]

# Servidor
server.port=${PORT:8081}

# Base de datos: solo por variables de entorno (sin credenciales en el repo)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.hibernate.naming.physical-strategy=com.edifika.iam.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.days=${JWT_EXPIRATION_DAYS:365}

# Documentacion
documentation.application.description=@project.description@
documentation.application.version=@project.version@
# Usuarios por defecto (administrador y propietario), creados al arrancar si no existen
edifika.seed.default-users.enabled=${SEED_DEFAULT_USERS:true}
edifika.seed.admin.email=${SEED_ADMIN_EMAIL:admin@edifika.com}
# Sin contrasena por defecto: fuera del perfil "local" los usuarios demo solo se crean si se define
# SEED_ADMIN_PASSWORD / SEED_OWNER_PASSWORD (con contrasena vacia el seeder los omite y lo registra).
edifika.seed.admin.password=${SEED_ADMIN_PASSWORD:}
edifika.seed.owner.email=${SEED_OWNER_EMAIL:propietario@edifika.com}
edifika.seed.owner.password=${SEED_OWNER_PASSWORD:}

# RabbitMQ (patrón edifika.events, DLQ por cola). El retry de los listeners
# (3 intentos, back-off 1s x2 max 10s) se cablea en RabbitMqConfiguration
# (StatelessRetryOperationsInterceptor); las properties spring.rabbitmq.listener.simple.retry.*
# quedan sin efecto porque el factory del repo reemplaza al auto-configurado de Boot.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# Token compartido para endpoints internos servicio-a-servicio (sin JWT de usuario)
app.internal-api-token=${APP_INTERNAL_TOKEN}

# Mail (dev: Mailpit en localhost:1025, UI 8025; real por env vars)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
edifika.mail.from=${SMTP_FROM:no-reply@edifika.com}
edifika.app.url=${FRONTEND_APP_URL:http://localhost:4200}

# data.sql (datos de prueba) solo se ejecuta con el perfil "local"
spring.sql.init.mode=never
