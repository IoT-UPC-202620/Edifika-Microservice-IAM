spring.application.name=Edifika-Microservice-IAM

# Servidor
server.port=${PORT:8081}

# DB Supabase
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-us-west-1.pooler.supabase.com:6543/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres.uudchsabsgexzjxfadwf}
spring.datasource.password=${DATABASE_PASSWORD:s3IffDTG5yCkZs4d}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.hibernate.naming.physical-strategy=com.edifika.iam.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# JWT
jwt.secret=${JWT_SECRET:edifika-secret-key-must-be-at-least-32-characters-long}
jwt.expiration.days=${JWT_EXPIRATION_DAYS:365}

# Documentacion
documentation.application.description=@project.description@
documentation.application.version=@project.version@
# Usuarios por defecto (administrador y propietario), creados al arrancar si no existen
edifika.seed.default-users.enabled=${SEED_DEFAULT_USERS:true}
edifika.seed.admin.email=${SEED_ADMIN_EMAIL:admin@edifika.com}
edifika.seed.admin.password=${SEED_ADMIN_PASSWORD:Edifika#2026}
edifika.seed.owner.email=${SEED_OWNER_EMAIL:propietario@edifika.com}
edifika.seed.owner.password=${SEED_OWNER_PASSWORD:Edifika#2026}

# RabbitMQ (patrón edifika.events, DLQ por cola)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10000

# Mail (dev: Mailpit en localhost:1025, UI 8025; real por env vars)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
edifika.mail.from=${SMTP_FROM:no-reply@edifika.com}
edifika.app.url=${FRONTEND_APP_URL:http://localhost:4200}
