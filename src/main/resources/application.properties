spring.application.name=Edifika-Microservice-IAM

# Servidor
server.port=${PORT:8081}

# DB Supabase
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-us-west-1.pooler.supabase.com:6543/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres.uudchsabsgexzjxfadwf}
spring.datasource.password=${DATABASE_PASSWORD:s3IffDTG5yCkZs4d}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.hibernate.naming.physical-strategy=com.edifika.iam.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# JWT
jwt.secret=${JWT_SECRET:edifika-secret-key-must-be-at-least-32-characters-long}
jwt.expiration.days=${JWT_EXPIRATION_DAYS:365}

# Documentacion
documentation.application.description=@project.description@
documentation.application.version=@project.version@
# Usuarios por defecto (administrador y propietario), creados al arrancar si no existen
edifika.seed.default-users.enabled=${SEED_DEFAULT_USERS:true}
edifika.seed.admin.email=${SEED_ADMIN_EMAIL:admin@edifika.com}
edifika.seed.admin.password=${SEED_ADMIN_PASSWORD:Edifika#2026}
edifika.seed.owner.email=${SEED_OWNER_EMAIL:propietario@edifika.com}
edifika.seed.owner.password=${SEED_OWNER_PASSWORD:Edifika#2026}
