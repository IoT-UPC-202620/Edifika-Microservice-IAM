# Perfil "local": SOLO para la PC de desarrollo. Lo activa local/start-all.ps1
# (SPRING_PROFILES_ACTIVE=local). Sin secretos: solo localhost, postgres/password, puertos, pool y seeds.
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/edifika_iam}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
# pocas conexiones por servicio: 10 servicios contra un solo PostgreSQL local
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:4}
# datos de prueba (data.sql, idempotente) en cada arranque
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
# usuarios demo (admin@edifika.com, propietario@edifika.com): contrasena demo documentada en el README
edifika.seed.admin.password=${SEED_ADMIN_PASSWORD:Edifika#2026}
edifika.seed.owner.password=${SEED_OWNER_PASSWORD:Edifika#2026}
